name: sample-contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sample-contract:
    name: sample-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run synthetic contract tests
        run: python -c "import pathlib,subprocess,sys; sys.exit(subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_*.py']).returncode if pathlib.Path('tests').is_dir() else 0)"
